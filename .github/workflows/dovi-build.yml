name: Dolby Vision test build

# Temporary helper for the fea/dovi-profile7-conversion branch: builds a debug APK and uploads it
# so it can be installed on a device for testing. Remove before proposing the branch upstream.

on:
  push:
    branches:
      - fea/dovi-profile7-conversion
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx8g -XX:MaxMetaspaceSize=512m'"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Use a fixed debug signing key
        # A runner has no debug keystore, so Gradle makes a new one every build and every APK ends
        # up signed by a different key, which Android refuses to install over the one before it.
        # Where the tools look for it depends on ANDROID_USER_HOME, so that is set here rather than
        # guessed at, and the keystore is put in every place the lookup can land.
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          cp .github/keystore/debug.keystore "$HOME/.android/debug.keystore"
          if [ -n "${ANDROID_SDK_HOME:-}" ]; then
            mkdir -p "$ANDROID_SDK_HOME/.android"
            cp .github/keystore/debug.keystore "$ANDROID_SDK_HOME/.android/debug.keystore"
          fi
      - name: Build app
        run: |
          ./gradlew clean assembleDefaultDebug testDefaultDebugUnitTest --no-daemon
      - name: Check the APK carries the fixed key
        # Whether the key was picked up is only visible in the finished APK, so it is checked there
        # rather than assumed from having put the keystore in place.
        run: |
          apksigner="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          apk=$(find app/build/outputs/apk -name '*arm64-v8a.apk' | head -1)
          echo "Checking $apk"
          "$apksigner" verify --print-certs "$apk" | tee signer.txt
          expected=ad2af4dc0ab8491833ffd9c32632db8a9faa351b5895edef34b662089cbe1ce1
          if ! grep -qi "$expected" signer.txt; then
            echo "::error::The APK is not signed with .github/keystore/debug.keystore, so it will not install over the last build"
            exit 1
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wholphin-dovi-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
