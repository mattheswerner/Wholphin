name: Dolby Vision test build

# Temporary helper for the fea/dovi-profile7-conversion branch: builds a debug APK and uploads it
# so it can be installed on a device for testing. Remove before proposing the branch upstream.

on:
  push:
    branches:
      - fea/dovi-profile7-conversion
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx8g -XX:MaxMetaspaceSize=512m'"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Need the tags to build
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build app
        run: |
          ./gradlew clean assembleDefaultDebug testDefaultDebugUnitTest --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wholphin-dovi-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore
